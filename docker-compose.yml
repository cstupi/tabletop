name: tabletop

# Development only; deploy/ holds the production path. The servers run from the SDK image with `dotnet watch` over the repo
# bind-mounted at the host's own path:
# obj/Unix records absolute paths, so any other mount path would break the WSL host's restore. They run as the
# host user (TABLETOP_UID/TABLETOP_GID, default 1000) so the obj/ and bin/ they write stay deletable on the host.
x-dotnet: &dotnet
  image: mcr.microsoft.com/dotnet/sdk:10.0
  user: "${TABLETOP_UID:-1000}:${TABLETOP_GID:-1000}"
  working_dir: ${PWD}
  volumes:
    - ${PWD}:${PWD}
    - nuget-cache:/nuget
  env_file:
    - path: .env
      required: false
  environment: &dotnet-env
    HOME: /nuget/home
    NUGET_PACKAGES: /nuget/packages
    DOTNET_USE_POLLING_FILE_WATCHER: "true"
    DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    ASPNETCORE_ENVIRONMENT: Development
    TABLETOP_DEV_MODE: "1"                # with Development: the dev-session mint, SetDice, startup migrations; Development without it refuses to start

# The Vite dev servers run the same way: repo bind-mounted at the host's path, as the host user. node_modules is shared
# with the host (both Linux x64 glibc, so the native bindings match); `npm ci` runs on start only when package-lock.json
# differs from the copy last installed, recorded as a hash in node_modules/.tabletop-lock.sha256. Vite's inotify watch
# sees edits without polling: Docker Desktop's containers share the WSL kernel.
x-vite: &vite
  image: node:24.19.0-trixie-slim
  user: "${TABLETOP_UID:-1000}:${TABLETOP_GID:-1000}"
  volumes:
    - ${PWD}:${PWD}
    - npm-cache:/npm
  command:
    - sh
    - -c
    - >-
      sha256sum package-lock.json | cmp -s - node_modules/.tabletop-lock.sha256 ||
      { npm ci && sha256sum package-lock.json > node_modules/.tabletop-lock.sha256; } &&
      exec npm run dev
  depends_on:
    dev-init: { condition: service_completed_successfully }
    management: { condition: service_healthy }
  environment: &vite-env
    HOME: /npm/home
    npm_config_cache: /npm/cache
    npm_config_update_notifier: "false"
    TABLETOP_API_PROXY_TARGET: http://management:5100

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tabletop
      POSTGRES_USER: tabletop
      POSTGRES_PASSWORD: ${TABLETOP_DB_PASSWORD:-tabletop}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletop -d tabletop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO publishes no images of its own any more (quay.io/minio and Docker Hub minio/ are gone); pgsty/minio is the community
  # build of the same server, mc included. Pinned by digest; deploy/docker-compose.prod.yml uses the same.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TABLETOP_MINIO_ROOT_USER:-tabletop}
      MINIO_ROOT_PASSWORD: ${TABLETOP_MINIO_ROOT_PASSWORD:-tabletop-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5173,http://localhost:5173   # the web app's dev origins: browsers PUT presigned uploads here
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The bucket and the bucket-scoped service user management signs with (scripts/minio/init.sh); root stays with MinIO.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/scripts/init.sh"]
    volumes:
      - ./scripts/minio:/scripts:ro
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${TABLETOP_MINIO_ROOT_USER:-tabletop}
      MINIO_ROOT_PASSWORD: ${TABLETOP_MINIO_ROOT_PASSWORD:-tabletop-secret}
      S3_BUCKET: ${TABLETOP_S3_BUCKET:-tabletop-blobs}
      S3_APP_ACCESS_KEY: ${TABLETOP_S3_APP_ACCESS_KEY:-tabletop-app}
      S3_APP_SECRET_KEY: ${TABLETOP_S3_APP_SECRET_KEY:-tabletop-app-secret}

  dev-init:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /nuget/home /nuget/packages /npm/home /npm/cache && chown -R ${TABLETOP_UID:-1000}:${TABLETOP_GID:-1000} /nuget /npm"]
    volumes:
      - nuget-cache:/nuget
      - npm-cache:/npm

  # The first start restores and builds for minutes. Each container builds into its own obj/ and bin/ (TabletopBuildSlot,
  # Directory.Build.props), so a host build never restarts or breaks its watch. Game waits on management's migrations.
  management:
    <<: *dotnet
    command: ["dotnet", "watch", "run", "--non-interactive", "--project", "server/management/Tabletop.Management.csproj"]
    depends_on:
      dev-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *dotnet-env
      TABLETOP_DB_CONNECTION: Host=postgres;Port=5432;Database=tabletop;Username=tabletop;Password=${TABLETOP_DB_PASSWORD:-tabletop};Search Path=management,game,public
      TABLETOP_S3_ENDPOINT: http://minio:9000
      TABLETOP_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      TABLETOP_S3_ACCESS_KEY: ${TABLETOP_S3_APP_ACCESS_KEY:-tabletop-app}         # minio-init's service user, not root
      TABLETOP_S3_SECRET_KEY: ${TABLETOP_S3_APP_SECRET_KEY:-tabletop-app-secret}
      TabletopBuildSlot: -management
      TABLETOP_MANAGEMENT_URL: http://0.0.0.0:5100
    ports:
      - "127.0.0.1:5100:5100"   # loopback only: dev mode maps POST /v1/dev/sessions, which mints a session with no login
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5100"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

  game:
    <<: *dotnet
    command: ["dotnet", "watch", "run", "--non-interactive", "--project", "server/game/Tabletop.GameServer.csproj"]
    depends_on:
      dev-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      management: { condition: service_healthy }
    environment:
      <<: *dotnet-env
      TABLETOP_DB_CONNECTION: Host=postgres;Port=5432;Database=tabletop;Username=tabletop;Password=${TABLETOP_DB_PASSWORD:-tabletop};Search Path=management,game,public
      TabletopBuildSlot: -game
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:5200   # appsettings.json binds 127.0.0.1; the published port needs the container's interface
    ports:
      - "127.0.0.1:5200:5200"

  # The rules-suite runner (`sim serve`): the viewer's Tests page reaches it through the viewer's proxy (TABLETOP_SUITE_PROXY_TARGET).
  # Socket runs play against the game server and mint sessions at management; kept recordings land in ./recordings/runner.
  sim-runner:
    <<: *dotnet
    command: ["dotnet", "watch", "run", "--non-interactive", "--project", "sim/Tabletop.Sim.csproj", "--", "serve", "--port", "5180", "--bind", "0.0.0.0"]
    depends_on:
      dev-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      management: { condition: service_healthy }
      game: { condition: service_started }
    environment:
      <<: *dotnet-env
      TABLETOP_DB_CONNECTION: Host=postgres;Port=5432;Database=tabletop;Username=tabletop;Password=${TABLETOP_DB_PASSWORD:-tabletop};Search Path=management,game,public
      TABLETOP_SIM_WS: ws://game:5200/ws
      TABLETOP_SIM_MANAGEMENT: http://management:5100
      TabletopBuildSlot: -sim-runner
    ports:
      - "127.0.0.1:5180:5180"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5180"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

  web:
    <<: *vite
    working_dir: ${PWD}/web
    environment:
      <<: *vite-env
      PUBLIC_VIEWER_URL: http://127.0.0.1:5174/   # the admin Replays entry; production serves the viewer at /viewer/
    ports:
      - "127.0.0.1:5173:5173"

  viewer:
    <<: *vite
    working_dir: ${PWD}/viewer
    environment:
      <<: *vite-env
      VITE_GAME_SOCKET: ${VITE_GAME_SOCKET:-ws://127.0.0.1:5200/ws}   # opened by the browser, so the host's address
      TABLETOP_SUITE_PROXY_TARGET: http://sim-runner:5180             # /suite and /runs, proxied like /v1
    ports:
      - "127.0.0.1:5174:5174"

volumes:
  postgres-data:
  minio-data:
  nuget-cache:
  npm-cache:
