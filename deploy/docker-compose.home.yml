# Home-server stack (docker1): everything in containers, fronted by the owner's Caddy on the external network gateway_default,
# which reaches web, management, game and MinIO by container name. Nothing publishes a host port. Run from the repo root:
#   scripts/release --deploy home            (or: docker compose --env-file home.env -f deploy/docker-compose.home.yml up -d --build)
# Every secret is a required variable (${VAR:?}); deploy/home.env.example lists them. Guide: deploy/README.md, Home server.
name: tabletop-home

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

x-pg-image: &pg-image postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372

services:
  postgres:
    <<: *hardened
    image: *pg-image
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-postgres
    user: "70:70"                       # the image's postgres user: no root step, so no capability is needed
    tmpfs: [/tmp, "/var/run/postgresql:uid=70,gid=70"]
    environment:
      POSTGRES_DB: tabletop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TABLETOP_PG_SUPERUSER_PASSWORD:?set TABLETOP_PG_SUPERUSER_PASSWORD}
      # Read once, by the init script on an empty volume (scripts/postgres/roles.sh).
      TABLETOP_DB_OWNER_PASSWORD: ${TABLETOP_DB_OWNER_PASSWORD:?set TABLETOP_DB_OWNER_PASSWORD}
      TABLETOP_DB_MANAGEMENT_PASSWORD: ${TABLETOP_DB_MANAGEMENT_PASSWORD:?set TABLETOP_DB_MANAGEMENT_PASSWORD}
      TABLETOP_DB_GAME_PASSWORD: ${TABLETOP_DB_GAME_PASSWORD:?set TABLETOP_DB_GAME_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data      # local disk, not the NAS
      - ../scripts/postgres/roles.sh:/docker-entrypoint-initdb.d/000_roles.sh:ro
    networks:
      backend:
        aliases: [tabletop-db]          # unique: a bare "postgres" can resolve to another stack's container on gateway_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tabletop"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly custom-format dump to the NAS, newest PG_BACKUP_KEEP kept (scripts/postgres/backup.sh).
  # A dump now: docker compose -f deploy/docker-compose.home.yml exec pg-backup /scripts/backup.sh once
  pg-backup:
    <<: *hardened
    image: *pg-image
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-pg-backup
    user: "${TABLETOP_NAS_UID:-1025}:${TABLETOP_NAS_GID:-100}"   # the NAS share's squash identity
    entrypoint: ["/scripts/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: tabletop-db
      PGDATABASE: tabletop
      PGUSER: tabletop_owner
      PGPASSWORD: ${TABLETOP_DB_OWNER_PASSWORD:?set TABLETOP_DB_OWNER_PASSWORD}
      PG_BACKUP_DIR: /backups
      PG_BACKUP_KEEP: ${TABLETOP_PG_BACKUP_KEEP:-14}
      PG_BACKUP_AT: ${TABLETOP_PG_BACKUP_AT:-03:30}
      TZ: UTC
    volumes:
      - ../scripts/postgres/backup.sh:/scripts/backup.sh:ro
      - ${TABLETOP_PG_BACKUP_DIR:-/mnt/tabletop/pg-backups}:/backups
    networks: [backend]

  minio:
    <<: *hardened
    image: *minio-image
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-minio
    # The NAS squashes every user to 1025:100; running as that identity keeps what MinIO reads back owned by itself.
    user: "${TABLETOP_NAS_UID:-1025}:${TABLETOP_NAS_GID:-100}"
    command: ["server", "/data", "--certs-dir", "/tmp/certs"]
    environment:
      MINIO_ROOT_USER: ${TABLETOP_MINIO_ROOT_USER:-tabletop-root}
      MINIO_ROOT_PASSWORD: ${TABLETOP_MINIO_ROOT_PASSWORD:?set TABLETOP_MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${TABLETOP_WEB_URL:?set TABLETOP_WEB_URL}
      MINIO_BROWSER: "off"
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - ${TABLETOP_MINIO_DATA:-/mnt/tabletop/minio}:/data
    networks:
      backend:
        aliases: [tabletop-s3]          # unique on every network the servers join (see tabletop-db)
      gateway: {}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    <<: *hardened
    restart: "no"
    image: *minio-image
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/scripts/init.sh"]
    volumes:
      - ../scripts/minio:/scripts:ro
    environment:
      MINIO_URL: http://tabletop-s3:9000
      MINIO_ROOT_USER: ${TABLETOP_MINIO_ROOT_USER:-tabletop-root}
      MINIO_ROOT_PASSWORD: ${TABLETOP_MINIO_ROOT_PASSWORD:?set TABLETOP_MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${TABLETOP_S3_BUCKET:-tabletop-blobs}
      S3_APP_ACCESS_KEY: ${TABLETOP_S3_ACCESS_KEY:?set TABLETOP_S3_ACCESS_KEY}
      S3_APP_SECRET_KEY: ${TABLETOP_S3_SECRET_KEY:?set TABLETOP_S3_SECRET_KEY}
      # The client-release publisher, Put on releases/* only (scripts/release-client upload); empty skips it.
      S3_RELEASE_ACCESS_KEY: ${RELEASE_S3_ACCESS_KEY:-}
      S3_RELEASE_SECRET_KEY: ${RELEASE_S3_SECRET_KEY:-}
    networks: [backend]

  # One-shot: the migrations, as the owner role. management starts only after it succeeds.
  migrate:
    <<: *hardened
    restart: "no"
    build: { context: .., dockerfile: server/management/Dockerfile }
    image: tabletop-management:${TABLETOP_VERSION:-latest}
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-migrate
    command: ["--migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TABLETOP_DB_CONNECTION: "Host=tabletop-db;Port=5432;Database=tabletop;GSS Encryption Mode=Disable;Username=tabletop_owner;Password=${TABLETOP_DB_OWNER_PASSWORD:?set TABLETOP_DB_OWNER_PASSWORD}"
    networks: [backend]

  management:
    <<: *hardened
    build: { context: .., dockerfile: server/management/Dockerfile }
    image: tabletop-management:${TABLETOP_VERSION:-latest}
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-management
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      TABLETOP_DB_CONNECTION: "Host=tabletop-db;Port=5432;Database=tabletop;Search Path=management,game,public;GSS Encryption Mode=Disable;Username=tabletop_management;Password=${TABLETOP_DB_MANAGEMENT_PASSWORD:?set TABLETOP_DB_MANAGEMENT_PASSWORD}"
      TABLETOP_S3_ENDPOINT: http://tabletop-s3:9000
      TABLETOP_S3_PUBLIC_ENDPOINT: ${TABLETOP_S3_PUBLIC_ENDPOINT:?set TABLETOP_S3_PUBLIC_ENDPOINT}
      TABLETOP_S3_BUCKET: ${TABLETOP_S3_BUCKET:-tabletop-blobs}
      TABLETOP_S3_ACCESS_KEY: ${TABLETOP_S3_ACCESS_KEY:?set TABLETOP_S3_ACCESS_KEY}
      TABLETOP_S3_SECRET_KEY: ${TABLETOP_S3_SECRET_KEY:?set TABLETOP_S3_SECRET_KEY}
      TABLETOP_STYTCH_BASE_URL: ${TABLETOP_STYTCH_BASE_URL:-https://api.stytch.com}
      TABLETOP_STYTCH_PROJECT_ID: ${TABLETOP_STYTCH_PROJECT_ID:?set TABLETOP_STYTCH_PROJECT_ID}
      TABLETOP_STYTCH_SECRET: ${TABLETOP_STYTCH_SECRET:?set TABLETOP_STYTCH_SECRET}
      TABLETOP_WEB_URL: ${TABLETOP_WEB_URL:?set TABLETOP_WEB_URL}
      # Caddy's address as management sees it: gateway_default's subnet (scripts/release reads it when unset in home.env).
      TABLETOP_TRUSTED_PROXIES: ${TABLETOP_TRUSTED_PROXIES:?set TABLETOP_TRUSTED_PROXIES to gateway_default's subnet}
    networks: [backend, gateway]          # gateway: Caddy in, and egress to Stytch and Army Forge
    dns: &dns                           # upstreams for Docker's resolver: the host's resolver config has broken container DNS
      - ${TABLETOP_DNS_1:-1.1.1.1}
      - ${TABLETOP_DNS_2:-9.9.9.9}

  game:
    <<: *hardened
    build: { context: .., dockerfile: server/game/Dockerfile }
    image: tabletop-game:${TABLETOP_VERSION:-latest}
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-game
    stop_grace_period: 40s              # the server's own shutdown timeout is 30 s
    depends_on:
      management: { condition: service_healthy }
    environment:
      TABLETOP_DB_CONNECTION: "Host=tabletop-db;Port=5432;Database=tabletop;Search Path=management,game,public;GSS Encryption Mode=Disable;Username=tabletop_game;Password=${TABLETOP_DB_GAME_PASSWORD:?set TABLETOP_DB_GAME_PASSWORD}"
      TABLETOP_STYTCH_BASE_URL: ${TABLETOP_STYTCH_BASE_URL:-https://api.stytch.com}
      TABLETOP_STYTCH_PROJECT_ID: ${TABLETOP_STYTCH_PROJECT_ID:?set TABLETOP_STYTCH_PROJECT_ID}
    networks: [backend, gateway]
    dns: *dns

  # The static web app on :8080 (web/Dockerfile). The blob origin is fixed into its CSP at build time.
  web:
    <<: *hardened
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        TABLETOP_BLOB_ORIGIN: ${TABLETOP_S3_PUBLIC_ENDPOINT:?set TABLETOP_S3_PUBLIC_ENDPOINT}
    image: tabletop-web:${TABLETOP_VERSION:-latest}
    container_name: ${TABLETOP_CONTAINER_PREFIX:-tabletop}-web
    tmpfs: [/tmp, "/data:uid=65534,gid=65534", "/config:uid=65534,gid=65534"]
    networks: [gateway]

networks:
  backend:
    internal: true                      # Postgres, the one-shots and the backup: no route out
  gateway:
    external: true
    name: ${TABLETOP_GATEWAY_NETWORK:-gateway_default}

volumes:
  postgres-data:
